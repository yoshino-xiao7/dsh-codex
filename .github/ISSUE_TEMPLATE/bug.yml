name: Bug 报告 / Bug report
description: 提交脱敏、可复现的问题 / Report a sanitized reproducible failure
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "不要提交 token、OAuth code、cookie、凭据文件、完整提示词、原图或完整 provider 响应。 / Never submit tokens, OAuth codes, cookies, credential files, complete prompts, source images, or complete provider responses."
  - type: input
    id: versions
    attributes:
      label: 精确版本 / Exact versions
      description: dsh-codex-community, DSH, pi-ai and Node.js
      placeholder: "0.0.1; DSH 0.1.1-rc.2; pi-ai 0.82.1; Node 22.22.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台 / Platform
      placeholder: "macOS 15 arm64 / Windows 11 x64 / Linux x64"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现 / Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误 / Actual result and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认 / Privacy confirmation
      options:
        - label: 我已移除所有凭据、账户信息、私人内容、图片和机器专属秘密。 / I removed all credentials, account data, private content, images, and machine-specific secrets.
          required: true
