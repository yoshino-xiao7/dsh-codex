name: CI

on:
  push:
    branches: [main, "yukiryou/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/dsh-runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the exact supported DSH CLI in isolation
        run: pnpm --dir test/fixtures/dsh-runtime install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run verify:release
      - name: Install the final npm tarball and boot a disposable Web profile
        env:
          DSH_CLI_ROOT: ${{ github.workspace }}/test/fixtures/dsh-runtime
        run: pnpm run smoke:dsh-profile
      - run: git diff --exit-code

  candidate-replay:
    name: Release candidate replay / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and verify the candidate packaging npm toolchain
        run: |
          set -eu
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.16.0
          test "$(npm --version)" = "11.16.0"
      - name: Replay the complete candidate without publishing
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          pnpm run release:candidate -- "$PACKAGE_VERSION"
      - name: Upload the CI replay candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsh-codex-community-${{ github.sha }}-ci-replay
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
