name: CI

on:
  push:
    branches: [main, "yukiryou/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/dsh-runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the exact supported DSH CLI in isolation
        run: pnpm --dir test/fixtures/dsh-runtime install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run verify:release
      - name: Install the final npm tarball and boot a disposable Web profile
        env:
          DSH_CLI_ROOT: ${{ github.workspace }}/test/fixtures/dsh-runtime
          DSH_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/npm-package
        run: pnpm run smoke:dsh-profile
      - run: git diff --exit-code
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/dsh-codex-community-*.tgz
          if-no-files-found: error
