name: Compatibility watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  current-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/dsh-runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the exact supported DSH runtime in isolation
        run: pnpm --dir test/fixtures/dsh-runtime install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - name: Report and signal registry drift without changing the lock
        run: node scripts/check-registry-drift.mjs

  dsh-profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/dsh-runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the exact supported DSH runtime in isolation
        run: pnpm --dir test/fixtures/dsh-runtime install --frozen-lockfile --ignore-scripts
      - name: Install the packed plugin and boot a disposable Web profile
        env:
          DSH_CLI_ROOT: ${{ github.workspace }}/test/fixtures/dsh-runtime
        run: node scripts/smoke-dsh-profile.mjs
