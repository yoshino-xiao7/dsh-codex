version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /test/fixtures/dsh-runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dsh-runtime:
        patterns:
          - "@deepseek-ai/*"
      pi-ai:
        patterns:
          - "@earendil-works/pi-ai"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      reviewed-actions:
        patterns:
          - "*"
